name: Create Tag Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Create Tag Release
    runs-on: ubuntu-latest
    # See https://cli.github.com/manual/gh
    steps:
      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${REF_NAME}" \
            --title="${REF_NAME}" \
            --repo="${GITHUB_REPOSITORY}" \
            --generate-notes
      - name: Checkout Code
        id: checkout_code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Assets
        id: create_assets
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v${VERSION}" != "${REF_NAME}" ]; then
            echo "tag ${REF_NAME} does not match the pyproject.toml version ${VERSION}"
            exit 1
          fi
          python3 scripts/addon_tasks.py package \
            --output "service.subtitles.universalsubs-${REF_NAME}.zip"
      - name: Upload Assets
        id: upload_assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "${REF_NAME}" \
            service.subtitles.universalsubs-${REF_NAME}.zip
